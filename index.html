<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class ="card">
        <h1>Loan Calculator</h1>
        <!-- Declare inputs for loan amount, interest rate and loan term -->
        <form>
            <div class="field">
                <label for="loanAmount">Loan Amount</label>
                <input type="number" id="loanAmount" placeholder="Loan Amount" min="1" required>
            </div>

            <div class="field">
                <label for="interestRate">Interest Rate (%)</label>
                <input type="number" id="interestRate" placeholder="0%" min="0" step="0.01">
            </div>

            <div class="field">
                <label for="loanTerm">Loan Term (years)</label>
                <input type="number" id="loanTerm" placeholder="Loan Term (years)" min="1" max="30" required>
            </div>

            <button id="calculateAmount">Calculate</button>
        </form>

        <!-- Creates an empty div for results outputted from the script -->
        <div id="result"></div>
    </main>
    <!-- Reference for JavaScript functionality -->
    <script src="script.js"></script>
</body>

</html>
